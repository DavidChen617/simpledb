* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f0f1a;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 20px;
}
h1 { color: #64ffda; margin-bottom: 24px; font-size: 1.3em; letter-spacing: 1px; }
#info-box {
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 16px 28px;
  margin-bottom: 24px;
  text-align: center;
  width: 760px;
}
#step-title {
  color: #64ffda;
  font-size: 1em;
  margin-bottom: 6px;
}
#step-desc { color: #888; font-size: 0.85em; }
#tree-container {

  border: 1px solid #2a2a4a;
  border-radius: 10px;
  margin-bottom: 24px;
  display: block;
}
#controls {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 20px;
}
button {
  background: #16213e;
  color: #64ffda;
  border: 1px solid #64ffda;
  border-radius: 6px;
  padding: 8px 22px;
  cursor: pointer;
  font-size: 0.95em;
  font-family: inherit;
  transition: background 0.15s;
}
button:hover:not(:disabled) { background: #0f3460; }
button:disabled { opacity: 0.25; cursor: default; }
#step-counter { color: #666; font-size: 0.85em; min-width: 80px; text-align: center; }
.legend {
  display: flex;
  gap: 22px;
  font-size: 0.78em;
  color: #888;
}
.legend-item { display: flex; align-items: center; gap: 7px; }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>

  internal: { fill:'#1a1a3e', stroke:'#9c27b0', text:'#ce93d8' },

  new:      { text:'#66bb6a' }
};

const LEVEL_GAP = 110;
const NODE_H = 46;
const CELL_W = 76;
const PAD = 10;
const NODE_GAP = 24;

function getMaxDepth(node) {
  if (node.type === 'leaf') return 0;
  return 1 + Math.max(...node.children.map(getMaxDepth));
}

function subtreeWidth(node) {
  if (node.type === 'leaf') return node.cells.length * CELL_W + PAD * 2;
  const childTotal = node.children.reduce((s, c) => s + subtreeWidth(c), 0)
                   + (node.children.length - 1) * NODE_GAP;
  return Math.max(childTotal, node.keys.length * 52 + PAD * 2);
}

function layout(node, cx, depth) {
  node._depth = depth;
  node._y = depth * LEVEL_GAP + 50;
  node._x = cx;
  if (node.type === 'leaf') {
    node._w = node.cells.length * CELL_W + PAD * 2;
  } else {
    node._w = node.keys.length * 52 + PAD * 2;
    const widths = node.children.map(subtreeWidth);
    const total = widths.reduce((a, b) => a + b, 0) + (node.children.length - 1) * NODE_GAP;
    let x = cx - total / 2;
    node.children.forEach((child, i) => {
      layout(child, x + widths[i] / 2, depth + 1);
      x += widths[i] + NODE_GAP;
    });
  }
}

function drawLine(svg, x1, y1, x2, y2) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  el.setAttribute('x1', x1); el.setAttribute('y1', y1);
  el.setAttribute('x2', x2); el.setAttribute('y2', y2);
  el.setAttribute('stroke', '#3a3a5a');
  el.setAttribute('stroke-width', '1.5');
  svg.appendChild(el);
}

function drawRect(svg, x, y, w, h, fill, stroke, r=6) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  el.setAttribute('x', x); el.setAttribute('y', y);
  el.setAttribute('width', w); el.setAttribute('height', h);
  el.setAttribute('rx', r);
  el.setAttribute('fill', fill); el.setAttribute('stroke', stroke);
  el.setAttribute('stroke-width', '1.5');
  svg.appendChild(el);
}

function drawText(svg, x, y, text, color, size, anchor='middle', weight='normal') {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  el.setAttribute('x', x); el.setAttribute('y', y);
  el.setAttribute('text-anchor', anchor);
  el.setAttribute('fill', color);
  el.setAttribute('font-size', size);
  el.setAttribute('font-family', 'Courier New');
  el.setAttribute('font-weight', weight);
  el.textContent = text;
  svg.appendChild(el);
}

function drawDivider(svg, x, y1, y2, stroke) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  el.setAttribute('x1', x); el.setAttribute('y1', y1 + 5);
  el.setAttribute('x2', x); el.setAttribute('y2', y2 - 5);
  el.setAttribute('stroke', stroke); el.setAttribute('stroke-width', '0.5');
  el.setAttribute('opacity', '0.35');
  svg.appendChild(el);
}

function drawNode(svg, node) {
  if (node.type === 'internal') {
    node.children.forEach(child => {
      drawLine(svg, node._x, node._y + NODE_H, child._x, child._y);
      drawNode(svg, child);
    });

    const color = node.status === 'full' ? C.intFull : C.internal;
    const x = node._x - node._w / 2;
    drawRect(svg, x, node._y, node._w, NODE_H, color.fill, color.stroke);

    node.keys.forEach((key, i) => {
      const kx = x + PAD + i * 52 + 26;
      if (i > 0) drawDivider(svg, kx - 26, node._y, node._y + NODE_H, color.stroke);
      drawText(svg, kx, node._y + NODE_H / 2 + 6, String(key), color.text, 15, 'middle', 'bold');
    });

    drawText(svg, x - 6, node._y + NODE_H / 2 + 5, 'internal', '#444', 9, 'end');

  } else {
    const color = node.status === 'full' ? C.full : node.status === 'split' ? C.split : C.normal;
    const x = node._x - node._w / 2;
    drawRect(svg, x, node._y, node._w, NODE_H, color.fill, color.stroke);

    node.cells.forEach((cell, i) => {
      const cx = x + PAD + i * CELL_W;
      if (i > 0) drawDivider(svg, cx, node._y, node._y + NODE_H, color.stroke);
      const tc = cell.status === 'new' ? C.new.text : color.text;
      const fw = cell.status === 'new' ? 'bold' : 'normal';
      drawText(svg, cx + CELL_W / 2, node._y + 18, `id:${cell.key}`, tc, 12, 'middle', fw);
      drawText(svg, cx + CELL_W / 2, node._y + 34, cell.name, tc, 10, 'middle', fw);
    });

    drawText(svg, x - 6, node._y + NODE_H / 2 + 5, 'leaf', '#444', 9, 'end');
  }
}

function render() {
  const step = steps[currentStep];
  const svg = document.getElementById('tree-container');
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const totalW = Math.max(subtreeWidth(step.tree) + 120, 860);
  svg.setAttribute('width', totalW);
  layout(step.tree, totalW / 2, 0);

  const depth = getMaxDepth(step.tree);
  const h = (depth + 1) * LEVEL_GAP + 70;
  svg.setAttribute('height', h);

  drawNode(svg, step.tree);

  document.getElementById('step-title').textContent = step.insert;
  document.getElementById('step-desc').textContent = step.desc;
  document.getElementById('step-counter').textContent = `${currentStep + 1} / ${steps.length}`;
  document.getElementById('prev').disabled = currentStep === 0;
  document.getElementById('next').disabled = currentStep === steps.length - 1;
}

document.getElementById('prev').addEventListener('click', () => { currentStep--; render(); });
document.getElementById('next').addEventListener('click', () => { currentStep++; render(); });

render();
</script>
</body>
